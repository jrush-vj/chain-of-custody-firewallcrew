<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witness · Auditor</title>
<style>
/* Layout per MD_FILES/ui_design.md: main panel + three layer cards on the right, heartbeat monitor along the bottom. */
:root{
  --bg:#0a0e13;--panel:#111821;--panel2:#16202b;--line:#223041;--text:#e3eaf2;--muted:#8394a8;
  --green:#34d399;--green-bg:#0f2c22;--red:#ff5c5c;--red-bg:#3a1416;--grey:#5b6878;--grey-bg:#1a222c;--amber:#fbbf24;--blue:#6aa8ff;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;--sans:"Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);overflow:hidden}
.app{height:100%;display:grid;gap:12px;padding:12px 16px;
  grid-template-columns:minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr) minmax(0,1fr) 25vh;
  grid-template-areas:"top top" "main l1" "main l2" "mon l3"}
.top{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:20px;letter-spacing:.02em}
.top h1 span{color:var(--muted);font-weight:400}
.conn{font:700 15px var(--mono);padding:6px 14px;border-radius:8px;background:var(--grey-bg);color:var(--muted)}
.conn.connected{background:var(--green-bg);color:var(--green)}
.conn.lost,.conn.quarantined{background:var(--red-bg);color:var(--red)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0;min-height:0}
.main{grid-area:main;padding:22px 26px;overflow:auto}
.card{padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-width:2px;text-align:left;font:inherit;color:inherit}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card .lbl{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .nm{font-size:20px;font-weight:700}
.card .st{font:700 15px var(--mono);margin-top:auto}
.card .when{color:var(--muted);font-size:13px;font-family:var(--mono)}
.card.idle{border-color:var(--line)}.card.idle .st{color:var(--grey)}
.card.passed{border-color:#1d5a42}.card.passed .st{color:var(--green)}
.card.caught{border-color:var(--red);background:linear-gradient(180deg,var(--red-bg),var(--panel) 70%)}.card.caught .st{color:var(--red)}
.card.active{box-shadow:inset 0 0 0 1px var(--text)}
#c1{grid-area:l1}#c2{grid-area:l2}#c3{grid-area:l3}
.mon{grid-area:mon;padding:10px 14px;display:flex;flex-direction:column}
.mon .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mon .legend{letter-spacing:0;text-transform:none;font-weight:400}
.mon .legend b{font-weight:700}
.mon canvas{flex:1;width:100%;min-height:0;display:block}
h2{margin:0 0 4px;font-size:30px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 20px;font-size:17px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:10px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat .k{color:var(--muted);font-size:14px}
.stat .v{font:700 30px var(--mono);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v.ok{color:var(--green)}.stat .v.bad{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td.m{font-family:var(--mono);white-space:nowrap}
tr.hit td{background:var(--red-bg);color:#ffd7d7}
tr.hit td:first-child{box-shadow:inset 4px 0 0 var(--red)}
.rule{margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--red-bg);color:#ffd7d7;font-size:17px}
pre.diff{margin:12px 0 0;padding:12px;background:#070a0e;border:1px solid var(--line);border-radius:8px;font:14px/1.5 var(--mono);overflow-x:auto}
pre.diff .add{color:var(--green)}pre.diff .del{color:var(--red)}
.rec-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline}
.rec-head .t{color:var(--muted);font-family:var(--mono)}
.cmp{display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);margin-top:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cmp>div{padding:10px 14px;border-bottom:1px solid var(--line);font:18px var(--mono);overflow-wrap:anywhere}
.cmp .h{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel2)}
.cmp .f{color:var(--muted)}
.cmp .bad{color:var(--red);font-weight:700;background:var(--red-bg)}
.hash{margin-top:8px;color:var(--muted);font:12px var(--mono);display:grid;grid-template-columns:150px minmax(0,1fr) minmax(0,1fr);gap:0 14px;padding:0 14px;overflow-wrap:anywhere}
.more{margin-top:18px}
.more li{font-family:var(--mono);margin:4px 0}
.alist li{margin:6px 0}
.tt{font:700 13px var(--mono);padding:2px 9px;border-radius:999px;background:var(--red-bg);color:var(--red)}
.quar{font-size:28px;font-weight:800;color:var(--red);margin:0 0 18px}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.ev{grid-template-columns:1fr}}
.holders td{font-size:17px;padding:5px 10px}.feed li{line-height:1.6}
.pill{font:700 13px var(--mono);padding:3px 10px;border-radius:999px}
.pill.pending{background:var(--grey-bg);color:var(--muted)}.pill.approved{background:var(--green-bg);color:var(--green)}
button.ap{font:600 15px var(--sans);padding:7px 16px;border-radius:8px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer}
button.ap:disabled{opacity:.35;cursor:default}
.need{margin-top:10px;color:var(--muted);font-size:17px}
.empty{color:var(--muted);font-style:italic}
.topr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.restore{font:700 14px var(--sans);padding:7px 14px;border-radius:8px;border:1px solid var(--amber);background:var(--amber);color:#1a1300;cursor:pointer}
.restore:disabled{opacity:.5;cursor:default}
.tz{font:600 12px var(--mono);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.restore-msg{font:13px var(--mono);color:var(--muted);max-width:460px;text-align:right}
.feed{list-style:none;padding:0;margin:0;font:16px/1.9 var(--mono)}.feed .m{color:var(--muted)}.okc{color:var(--green);font-weight:700}.badc{color:var(--red);font-weight:700}
.card .ds{color:var(--muted);font-size:14px}
.feed.cols{columns:2;column-gap:24px}
@media (max-width:900px){body{overflow:auto}.app{height:auto;grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"top" "l1" "l2" "l3" "main" "mon"}.main{min-height:60vh}.mon{height:220px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>Chain of Custody · Witness <span>auditor view</span></h1>
    <div class="topr"><span class="tz">All times IST</span><span class="restore-msg" id="restoremsg"></span><button class="restore" id="restore" type="button">Restore to normal</button><span class="conn" id="conn">CONNECTING</span></div></div>
  <section class="panel main" id="main" aria-live="polite"></section>
  <button class="panel card idle" id="c1" data-layer="1"><span class="lbl">Layer 1</span><span class="nm">Custom commands</span><span class="ds">Guarded commands need the team's profile-id</span><span class="when"></span><span class="st">IDLE</span></button>
  <button class="panel card idle" id="c2" data-layer="2"><span class="lbl">Layer 2</span><span class="nm">Heartbeat &amp; checksum</span><span class="ds">Sealed records, random checks, truth check</span><span class="when"></span><span class="st">IDLE</span></button>
  <button class="panel card idle" id="c3" data-layer="3"><span class="lbl">Layer 3</span><span class="nm">Quarantine</span><span class="ds">Network cut → server locks itself down</span><span class="when"></span><span class="st">IDLE</span></button>
  <section class="panel mon"><div class="hd"><span>Live heartbeat monitor</span>
    <span class="legend"><b style="color:var(--blue)">▲</b> witness asks · <b style="color:var(--green)">▼</b> matches · <b style="color:var(--red)">▼</b> tampered · <b style="color:var(--amber)">?</b> no answer · <b style="color:var(--muted)">•</b> heartbeat</span></div>
    <canvas id="mon" aria-label="Heartbeat and random check monitor"></canvas></section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Every time on the page is Indian Standard Time, whatever the viewer's computer is set to.
const IST = { hour12: false, timeZone: "Asia/Kolkata" };
const clock = (t) => new Date(t * 1000).toLocaleTimeString("en-GB", IST);
// Accepts an ISO string, or epoch seconds (layer events arrive as seconds; transaction events as ISO).
const isoClock = (s) => { const d = new Date(typeof s === "number" ? s * 1000 : s); return isNaN(d) ? esc(s) : d.toLocaleTimeString("en-GB", IST); };
const L2_KINDS = new Set(["sequence_gap", "chain_break", "bad_signature", "unknown_key_id", "entry_edited", "entry_deleted",
  "entries_reordered", "entry_replayed", "late_entry", "challenge_mismatch", "bad_challenge_signature", "record_mismatch",
  "non_monotonic_timestamp", "silence", "missed_challenge", "bad_heartbeat", "replayed_heartbeat", "balance_misreported", "db_edited_without_log"]);
// The fields the witness records for every banking transaction. The amount is kept in minor units.
const NAMES = { txn_id: "transaction", type: "type", amount_minor: "amount", event_id: "event id" };
const SHOWN = ["txn_id", "type", "amount_minor", "event_id"];
// The reconciliation names the changed field "amount"; the copies carry it as amount_minor.
const fieldKey = (k) => (k === "amount" ? "amount_minor" : k);
const money = (f, v) => (f === "amount_minor" && Number.isInteger(v) ? (v / 100).toFixed(2) : v ?? "—");

let S = null, alerts = [], events = [], mism = [], acts = [], lastAct = 0, offset = 0;
let view = 0, pinned = false, prevCaught = { 1: 0, 2: 0, 3: 0 };

async function j(p) { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }

function layerState() {
  const l1 = alerts.filter((a) => a.kind === "layer1_tripwire");
  const l2 = alerts.filter((a) => L2_KINDS.has(a.kind) && !a.resolved);
  const q = S && S.quarantine;
  const on = (n) => S && S.layers[n] !== "off";
  return {
    1: { st: !on(1) ? "idle" : l1.length ? "caught" : "passed", n: l1.length, t: l1.length ? l1[l1.length - 1].time : null },
    2: { st: !on(2) ? "idle" : l2.length ? "caught" : S && S.connection === "waiting" ? "idle" : "passed", n: l2.length, t: l2.length ? l2[l2.length - 1].time : null },
    3: { st: !on(3) ? "idle" : q && q.active ? "caught" : "passed", n: q && q.active ? 1 : 0, t: q && q.since },
  };
}

function renderCards(ls) {
  for (const n of [1, 2, 3]) {
    const c = $("c" + n), s = ls[n];
    c.className = `panel card ${s.st}${view === n ? " active" : ""}`;
    c.querySelector(".st").textContent = s.st === "caught" ? (n === 3 ? "QUARANTINED" : `CAUGHT · ${s.n}`) : s.st === "passed" ? "PASSED" : "IDLE";
    c.querySelector(".when").textContent = s.st === "caught" && s.t ? "fired " + clock(s.t) : "";
    if (s.n > prevCaught[n] && !pinned) view = n;  // auto-switch to the layer that just caught something
    prevCaught[n] = s.n;
  }
}

function screen0() {
  const s = S, lv = s.last_verified;
  return `<h2>${esc(s.platform_id || "Waiting for server")}</h2>
  <p class="sub">${s.connection === "connected" ? "Connected · every record sealed, checked and verified" : s.connection === "lost" ? "No contact with the server" : "Waiting for the first heartbeat"}</p>
  <div class="big">
    <div class="stat"><div class="k">Status</div><div class="v ${s.connection === "connected" ? "ok" : "bad"}">${esc(s.connection.toUpperCase())}</div></div>
    <div class="stat"><div class="k">Last verified record</div><div class="v">${lv ? "#" + lv.seq : "—"}</div><div class="k">${lv ? isoClock(lv.time) : ""}</div></div>
    <div class="stat"><div class="k">Records verified</div><div class="v">${s.records_verified}</div></div>
    <div class="stat"><div class="k">Last full check</div><div class="v">${s.last_sweep ? clock(s.last_sweep) : "—"}</div><div class="k">rolling sweep of every record</div></div>
  </div>
  <h3 style="margin:26px 0 8px;color:var(--muted);font-size:14px;letter-spacing:.1em;text-transform:uppercase">Latest random checks</h3>
  <ul class="feed">${acts.filter((a) => a.kind.startsWith("challenge_") && a.kind !== "challenge_issued").slice(-6).reverse()
    .map((a) => `<li><span class="m">${clock(a.time)}</span> <span class="${a.kind === "challenge_ok" ? "okc" : "badc"}">${a.kind === "challenge_ok" ? "✓" : "✗"}</span> ${esc(a.detail.replace(/^c-[0-9a-f]+ /, ""))}</li>`).join("") || '<li class="empty">Waiting for the first check…</li>'}</ul>`;
}

function screen1() {
  const rows = events.filter((e) => e.layer === 1);
  if (!rows.length) return `<h2>Layer 1 · Custom commands</h2><p class="sub">No commands seen yet. The team uses <code>&lt;cmd&gt; --&lt;profile-id&gt;</code>; anything else trips.</p>`;
  const last = [...rows].reverse().find((e) => e.state === "alert" && !e.resolved);
  const diffEv = [...rows].reverse().find((e) => e.detail && e.detail.diff);
  const snapEv = [...rows].reverse().find((e) => e.detail && e.detail.approved_content !== undefined);
  const body = rows.slice(-14).reverse().map((e) => {
    const d = e.detail || {}, w = e.who || {};
    return `<tr class="${e.state === "alert" && !e.resolved ? "hit" : ""}"><td class="m">${isoClock(e.time)}</td><td>${esc(w.user || (w.uid ?? "—"))}</td><td class="m">${esc(w.src_ip || "local")}</td><td class="m">${esc(d.cmd || e.trigger)}</td><td>${esc(e.resolved ? "restored" : d.result || (e.state === "alert" ? "caught" : "logged"))}</td></tr>`;
  }).join("");
  const diff = diffEv ? `<pre class="diff">${esc(diffEv.detail.diff).split("\n").map((l) => l.startsWith("+") && !l.startsWith("+++") ? `<span class="add">${l}</span>` : l.startsWith("-") && !l.startsWith("---") ? `<span class="del">${l}</span>` : l).join("\n")}</pre>` : "";
  return `<h2>Layer 1 · Custom commands</h2><p class="sub">Command log from the server</p>
  <table><thead><tr><th>Time</th><th>User</th><th>Source IP</th><th>Command</th><th>Result</th></tr></thead><tbody>${body}</tbody></table>
  ${last ? `<div class="rule">Rule broken: ${esc(last.detail.rule || "Command not in the allowed command set")}.</div>` : ""}
  ${snapEv ? `<p class="sub" style="margin:16px 0 0">${esc(snapEv.detail.file || "log")}: original (approved) vs now</p><div class="ev"><div><b>Original</b><pre class="diff">${esc(snapEv.detail.approved_content || "(empty)")}</pre></div><div><b>Now</b><pre class="diff">${esc(snapEv.detail.current_content || "(file removed)")}</pre></div></div>` : ""}
  ${diffEv ? `<p class="sub" style="margin:16px 0 0">Changes, original → now</p>${diff}` : ""}`;
}

function screen2() {
  const others = alerts.filter((a) => L2_KINDS.has(a.kind) && a.kind !== "record_mismatch" && !a.resolved);
  const otherList = others.length ? `<div class="more"><h3>Other Layer 2 alerts</h3><ul class="alist">${others.map((a) => `<li><span class="tt">${esc(a.tamper_type || a.kind)}</span> ${esc(a.detail)} <span class="empty">${clock(a.time)}</span></li>`).join("")}</ul></div>` : "";
  if (!mism.length) {
    return `<h2>Layer 2 · Heartbeat &amp; checksum</h2><p class="sub">${others.length ? "Tampering detected" : "Every record checked so far matches the sealed copy"}</p>${otherList}`;
  }
  const m = mism[0], w = m.witness_copy || {}, f = m.server_copy || {}, changed = new Set(m.fields.map(fieldKey));
  const rows = m.server_copy === null
    ? `<div class="f">record</div><div>${esc(w.txn_id)} …</div><div class="bad">missing on server</div>`
    : SHOWN.map((k) => `<div class="f">${NAMES[k] || k}</div><div>${esc(money(k, w[k]))}</div><div class="${changed.has(k) ? "bad" : ""}">${esc(money(k, f[k]))}${changed.has(k) ? " ←" : ""}</div>`).join("");
  const rest = mism.slice(1);
  return `<div class="rec-head"><h2>Record #${m.seq}</h2><span class="t">Caught by ${esc(m.caught_by.replace(/ \(c-[0-9a-f]+\)/, ""))} at ${clock(m.caught_time)}</span></div>
  <div class="cmp"><div class="h">Field</div><div class="h">Expected (witness copy)</div><div class="h">Found on server</div>${rows}</div>
  <div class="hash"><span>hash</span><span>${esc((m.witness_hash || "").slice(0, 12))}…</span><span>${m.server_hash ? esc(m.server_hash.slice(0, 12)) + "…" : "—"}</span></div>
  ${rest.length ? `<div class="more"><h3>Also tampered (found in the sweep)</h3><ul>${rest.map((x) => `<li>#${x.seq} · ${esc(x.fields.length ? x.fields.map((k) => NAMES[fieldKey(k)] || k).join(", ") : "record")}: ${x.server_copy ? x.fields.map((k) => { const key = fieldKey(k); return esc(money(key, x.witness_copy[key])) + " → " + esc(money(key, x.server_copy[key])); }).join(", ") : "missing on server"}</li>`).join("")}</ul></div>` : ""}
  ${otherList}`;
}

function screen3() {
  const q = S.quarantine, last = events.filter((e) => e.layer === 3);
  if (!q || !q.active) {
    const rel = [...last].reverse().find((e) => e.trigger === "quarantine:released");
    return `<h2>Layer 3 · Quarantine</h2><p class="sub">Not active. If the banking server loses contact with the witness for ${(q && q.after) || 45} s, or its witness link settings change, Layer 3 responds. This is a dry run: the response is recorded and nothing is executed.</p>
    ${rel ? `<p class="sub">Last quarantine <b>${esc(rel.detail.quarantine_id)}</b> released at ${isoClock(rel.time)} after key-holder approval.</p>` : ""}`;
  }
  const lv = S.last_verified, approved = q.holders.filter((h) => h.approved).length;
  const holders = q.holders.map((h, i) =>
    `<tr><td>${esc(h.name)}</td><td><span class="pill ${h.approved ? "approved" : "pending"}">${h.approved ? "Approved" : "Pending"}</span></td><td><button class="ap" data-holder="${i}" ${h.approved ? "disabled" : ""}>Approve</button></td></tr>`).join("");
  const acts = last.filter((e) => e.detail && e.detail.quarantine_id === q.id && e.trigger === "quarantine:locked");
  const actions = acts.length ? [...(acts[0].detail.site_down || []), ...(acts[0].detail.lockout || [])] : [];
  const dry = acts.length && acts[0].detail.dry_run;
  const status = q.unlock_issued ? "Unlock signed by the witness. Waiting for the server to apply it…"
    : approved >= q.needed ? "Approvals complete. Unlock will be signed once the server reports in."
    : `${q.needed} of ${q.holders.length} approvals needed to unlock.`;
  return `<p class="quar">${q.confirmed ? (dry ? "Layer 3 triggered (dry run). No account was logged out." : "Banking server has quarantined itself.") : "The witness has lost contact with the banking server."}</p>
  <p class="sub">${q.confirmed ? `Server confirmed quarantine <b>${esc(q.id)}</b>${acts.length && acts[0].detail.reason ? ": " + esc(acts[0].detail.reason) : ""}.` : "Reported by the witness: no contact with the server for over " + q.after + " s."} Since ${clock(q.since)}.</p>
  <div class="ev">
    <div class="stat"><div class="k">Verified and stored on witness</div><div class="v ok">#1 – #${lv ? lv.seq : 0}</div><div class="k">${lv ? "up to " + isoClock(lv.time) : ""}</div></div>
    <div class="stat"><div class="k">Unverified since cut</div><div class="v bad">${q.unverified == null ? "unknown" : q.unverified + " records"}</div><div class="k">${q.unverified == null ? "held on the server until the network is back" : "received after reconnect, being verified"}</div></div>
  </div>
  ${actions.length ? `<h3 style="margin-top:20px">${dry ? "What Layer 3 would do" : "What the server did"}${dry ? ' <span class="empty">(dry run: recorded, nothing executed)</span>' : ""}</h3><ul class="feed cols">${actions.map((r) => `<li><span class="okc">${dry ? "•" : "✓"}</span> ${esc(r.cmd)}</li>`).join("")}</ul>` : ""}
  <h3 style="margin-top:20px">Key holders</h3>
  <table class="holders"><tbody>${holders}</tbody></table>
  <p class="need">${status}</p>`;
}

function renderMain() {
  if (!S) return;
  const html = view === 1 ? screen1() : view === 2 ? screen2() : view === 3 ? screen3() : screen0();
  if ($("main").dataset.html !== html) { $("main").innerHTML = html; $("main").dataset.html = html; }
}

$("main").addEventListener("click", async (e) => {
  const b = e.target.closest("button.ap");
  if (!b) return;
  b.disabled = true;
  try { await fetch("/quarantine/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ holder: Number(b.dataset.holder) }) }); } catch (err) { b.disabled = false; }
});
for (const n of [1, 2, 3]) $("c" + n).addEventListener("click", () => { view = view === n ? 0 : n; pinned = view !== 0; renderAll(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "0") { view = 0; pinned = false; renderAll(); } });

// Heartbeat monitor: 120 s scrolling window, so several 30 s heartbeats are visible. Up spike = witness asks, down spike = answer.
const WINDOW = 120;
function label(detail) {
  const m = /record #(\d+)/.exec(detail) || /sweep #(\d+)-#(\d+)/.exec(detail);
  if (m && m[2]) return `#${m[1]}–${m[2]}`;
  if (m) return "#" + m[1];
  const st = /state (\S+)/.exec(detail);
  return st ? st[1] : "#latest";
}
function drawMonitor() {
  const cv = $("mon"), dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const now = Date.now() / 1000 + offset, mid = H * 0.55, amp = Math.min(H * 0.38, 70), x = (t) => W - ((now - t) / WINDOW) * W;
  const css = getComputedStyle(document.documentElement), col = (v) => css.getPropertyValue(v).trim();
  g.strokeStyle = col("--line"); g.lineWidth = 1;
  for (let s = 0; s <= WINDOW; s += 15) { const xx = x(now - s); g.beginPath(); g.moveTo(xx, 8); g.lineTo(xx, H - 4); g.stroke(); }
  const recent = acts.filter((a) => a.time > now - WINDOW - 5);
  const beats = recent.filter((a) => a.kind === "heartbeat");
  const lastBeat = S && S.heartbeat_age != null ? S.server_time - S.heartbeat_age : null;
  const dead = !lastBeat || now - lastBeat > 2.5 * ((S && S.heartbeat_interval) || 30);
  // baseline: green while heartbeats arrive, flat red once they stop
  g.lineWidth = 2; g.strokeStyle = dead ? col("--red") : col("--green"); g.setLineDash(dead ? [6, 6] : []);
  g.beginPath(); g.moveTo(0, mid);
  const spikes = recent.filter((a) => a.kind.startsWith("challenge_")).sort((a, b) => a.time - b.time);
  const askX = {};
  for (const a of spikes) {
    const id = a.detail.split(" ")[0];
    if (a.kind === "challenge_issued") { a.x = x(a.time); askX[id] = a.x; }
    else a.x = Math.max(x(a.time), (askX[id] ?? -1e9) + 14);
  }
  for (const a of spikes) {
    const xx = a.x; if (xx < 0) continue;
    const up = a.kind === "challenge_issued";
    g.lineTo(xx - 4, mid); g.lineTo(xx, up ? mid - amp : mid + amp * 0.8); g.lineTo(xx + 4, mid);
  }
  g.lineTo(W, mid); g.stroke(); g.setLineDash([]);
  // colour the spikes and label the asks
  g.font = "600 12px " + col("--mono"); g.textAlign = "center";
  const answered = new Set(spikes.filter((a) => a.kind !== "challenge_issued").map((a) => a.detail.split(" ")[0]));
  let lastLabel = 1e9;
  for (const a of [...spikes].reverse()) {
    const xx = a.x; if (xx < 0) continue;
    const id = a.detail.split(" ")[0];
    if (a.kind === "challenge_issued") {
      g.fillStyle = col("--blue");
      if (lastLabel - xx > 46) { g.fillText(label(a.detail), xx, mid - amp - 6); lastLabel = xx; }
      g.beginPath(); g.arc(xx, mid - amp, 3, 0, 7); g.fill();
      if (!answered.has(id) && now - a.time > 6) { g.fillStyle = col("--amber"); g.fillText("?", xx + 12, mid - amp * 0.4); }
    } else {
      const c = a.kind === "challenge_ok" ? col("--green") : col("--red");
      g.strokeStyle = c; g.lineWidth = 3; g.beginPath(); g.moveTo(xx - 4, mid); g.lineTo(xx, mid + amp * 0.8); g.lineTo(xx + 4, mid); g.stroke();
      if (a.kind !== "challenge_ok") { g.fillStyle = c; g.fillText("✗", xx, mid + amp * 0.8 + 16); }
    }
  }
  g.fillStyle = col("--muted");
  for (const b of beats) { const xx = x(b.time); if (xx >= 0) { g.beginPath(); g.arc(xx, mid, 2.5, 0, 7); g.fill(); } }
  g.textAlign = "left"; g.font = "12px " + col("--mono");
  g.fillText(dead ? "NO HEARTBEAT" : `heartbeat ${S ? (S.heartbeat_age ?? 0).toFixed(0) : 0}s ago`, 6, H - 8);
  g.textAlign = "right"; g.fillText(`−${WINDOW}s … now`, W - 6, H - 8);
}

function renderAll() {
  if (!S) return;
  const conn = S.quarantine && S.quarantine.active ? "quarantined" : S.connection;
  $("conn").className = "conn " + conn; $("conn").textContent = conn.toUpperCase();
  renderCards(layerState()); renderMain();
}

async function poll() {
  try {
    const [s, a, ev, mm, act] = await Promise.all([j("/status"), j("/alerts"), j("/timeline"), j("/mismatches"), j("/activity?since_id=" + lastAct)]);
    S = s; alerts = a.alerts; events = ev.events; mism = mm.mismatches;
    offset = s.server_time - Date.now() / 1000;
    for (const r of act.activity) {
      acts.push(r); lastAct = Math.max(lastAct, r.id);
      if (r.kind.startsWith("restore_")) lastRestore = r;
    }
    if (lastRestore && !restoreRequesting) {
      const done = lastRestore.kind === "restore_completed";
      $("restoremsg").textContent = `${done ? "Last restore completed" : lastRestore.kind === "restore_failed" ? "Last restore failed" : "Restore requested"} · ${clock(lastRestore.time)} · ${lastRestore.detail}`;
    }
    acts = acts.filter((r) => r.time > s.server_time - 200);
    renderAll();
  } catch (e) {
    $("conn").className = "conn lost"; $("conn").textContent = "WITNESS UNREACHABLE";
  }
}


let lastRestore = null, restoreRequesting = false;
$("restore").addEventListener("click", async () => {
  const button = $("restore"), msg = $("restoremsg");
  button.disabled = true; restoreRequesting = true; msg.textContent = "Asking ct105 to restore…";
  try {
    const r = await fetch("/v1/restore-request", { method: "POST" });
    const body = await r.json().catch(() => ({}));
    msg.textContent = r.status === 202 ? "Restore requested · ct105 applies it within about 10 seconds"
      : r.status === 429 ? `Wait ${body.retry_after_s} s before another restore`
      : r.status === 409 ? "A restore is already waiting for ct105" : "Restore request failed";
  } catch (e) { msg.textContent = "Restore request failed: witness unreachable"; }
  restoreRequesting = false;
  setTimeout(() => { button.disabled = false; }, 60000);
});

poll(); setInterval(poll, 1000);
(function loop() { drawMonitor(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
