<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witness · Auditor</title>
<style>
/* Visual system from the Secure Sphere console (hackfest/dashboard/public/honeypot/style.css):
   light, technical, IBM Plex, one action colour, meaning colours always paired with a text label.
   Layout: top bar; main panel + three layer cards on the right; heartbeat monitor along the bottom. */
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url("/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url("/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url("/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url("/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url("/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2")}
:root{
  --bg:#f3f4f6;--surface:#fff;--sunk:#f7f8fa;--line:#e2e5ea;--line-2:#cdd2da;
  --ink:#111827;--ink-2:#4b5563;--ink-3:#6b7280;
  --accent:#2445d6;--accent-bg:#eef1fd;
  --ok:#15803d;--ok-bg:#ecf8f0;--trap:#b45309;--trap-bg:#fdf4e7;--bad:#c42b2b;--bad-bg:#fcecec;--learn:#6d28d9;--learn-bg:#f2edfd;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular","Cascadia Code",Consolas,monospace;
  /* names the heartbeat canvas reads */
  --muted:var(--ink-3);--green:var(--ok);--red:var(--bad);--amber:var(--trap);--blue:var(--accent);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
code{font-family:var(--mono)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.topbar{display:flex;align-items:center;gap:20px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:30px;height:30px}.brand-mark path{fill:var(--ink)}.brand-mark circle{fill:#f59e0b}
.brand h1{font-size:17px}
.tagline{margin:1px 0 0;font-size:12px;color:var(--ink-3)}
.topr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.tz{font:500 11px var(--mono);color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
.restore-msg{font:12px var(--mono);color:var(--ink-3);max-width:420px;text-align:right}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:13px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#1f2937}
.btn.bob{background:var(--accent);border-color:var(--accent);color:#fff}.btn.bob:hover{background:#1d39b3}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.conn{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);font:600 11px var(--mono);letter-spacing:.06em;color:var(--ink-2)}
.conn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.conn.connected{color:var(--ok)}.conn.connected::before{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.conn.lost,.conn.quarantined{color:var(--bad)}.conn.lost::before,.conn.quarantined::before{background:var(--bad)}
.conn.waiting::before{background:var(--trap)}

/* grid */
.app{flex:1;min-height:0;display:grid;gap:12px;padding:12px;
  grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 24vh;
  grid-template-areas:"main l1" "main l2" "main l3" "mon l3"}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0}
.main{grid-area:main;padding:20px 24px;overflow:auto}
#c1{grid-area:l1}#c2{grid-area:l2}#c3{grid-area:l3}

/* layer cards */
.card{padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:inherit;border-left-width:3px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-2)}
.card .lbl{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.card .nm{font-size:16px;font-weight:600}
.card .ds{color:var(--ink-3);font-size:12.5px}
.card .when{color:var(--ink-3);font:12px var(--mono)}
.card .bob{font:500 12px var(--mono);color:var(--accent)}.card .bob:empty{display:none}
.card .st{margin-top:auto;align-self:flex-start;font:600 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:4px;background:var(--sunk);color:var(--ink-2)}
.card.idle{border-left-color:var(--line-2)}
.card.passed{border-left-color:var(--ok)}.card.passed .st{background:var(--ok-bg);color:var(--ok)}
.card.caught{border-left-color:var(--bad);background:linear-gradient(180deg,var(--bad-bg),var(--surface) 60%)}.card.caught .st{background:var(--bad-bg);color:var(--bad)}
.card.active{box-shadow:0 0 0 2px var(--accent)}
.card.disconnecting{position:relative;overflow:hidden;animation:l3flash 2s ease-in-out}
.card.disconnecting .st{animation:l3blink .5s steps(1) infinite}
@keyframes l3flash{0%,100%{box-shadow:0 0 0 0 rgba(196,43,43,0)}20%,60%{box-shadow:0 0 0 5px rgba(196,43,43,.25)}}
@keyframes l3blink{50%{opacity:.25}}

/* heartbeat monitor */
.mon{grid-area:mon;padding:10px 14px;display:flex;flex-direction:column}
.mon .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13px;font-weight:600}
.mon .legend{font:400 11.5px var(--mono);color:var(--ink-2)}.mon .legend b{font-weight:600}
.mon canvas{flex:1;width:100%;min-height:0;display:block;margin-top:6px;border-radius:8px;background-color:var(--sunk);
  background-image:radial-gradient(circle,#d9dde4 1px,transparent 1.2px);background-size:18px 18px}

/* main panel content */
h2{font-size:22px;margin:0 0 2px}
h3{font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 6px}
.sub{color:var(--ink-3);margin:0 0 16px;font-size:14px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:8px}
.stat{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat .k{color:var(--ink-3);font-size:12px}
.stat .v{font:600 22px/1.2 var(--sans);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v.ok{color:var(--ok)}.stat .v.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
td.m{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
tr.hit td{background:var(--bad-bg)}tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.rule,.what{margin:12px 0 0;padding:10px 14px;border-radius:8px;background:var(--bad-bg);border:1px solid #f3cccc;color:#7f1d1d;font-size:14px}
pre.diff{margin:10px 0 0;padding:12px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;font:12.5px/1.5 var(--mono);overflow-x:auto}
pre.diff .add{color:var(--ok)}pre.diff .del{color:var(--bad)}
.rec-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline}
.rec-head .t{color:var(--ink-3);font:12px var(--mono)}
.cmp{display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr);margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cmp>div{padding:9px 12px;border-bottom:1px solid var(--line);font:14px var(--mono);overflow-wrap:anywhere}
.cmp .h{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--sunk)}
.cmp .f{color:var(--ink-3)}
.cmp .bad{color:var(--bad);font-weight:600;background:var(--bad-bg)}
.cmp.four{grid-template-columns:120px repeat(3,minmax(0,1fr))}.cmp.four>div{font-size:13px}
.cmp .prev{color:var(--ink-3)}
.cmp mark{background:#f8b4b4;color:var(--ink);border-radius:3px;padding:0 1px}
.delta{font-size:12px;opacity:.9}
.more{margin-top:16px}.more li{font-family:var(--mono);font-size:13px;margin:4px 0}
.alist li{margin:6px 0}
.gbanner{margin:0 0 14px;padding:10px 14px;border:1px solid #b7791f;background:rgba(183,121,31,.15);border-radius:6px;font-size:14px}
.tt{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:4px;background:var(--bad-bg);color:var(--bad)}
.quar{font-size:20px;font-weight:600;color:var(--bad);margin:0 0 12px}
.ev{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.holders td{font-size:14px;padding:5px 10px}
.pill{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 7px;border-radius:4px}
.pill.pending{background:var(--sunk);color:var(--ink-3)}.pill.approved{background:var(--ok-bg);color:var(--ok)}
button.ap{font:500 13px var(--sans);min-height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer}
button.ap:hover{border-color:var(--ink-3)}button.ap:disabled{opacity:.4;cursor:default}
.need{margin-top:10px;color:var(--ink-2)}
.empty{color:var(--ink-3);font-style:normal}
.feed{list-style:none;padding:0;margin:0;font:13px/1.9 var(--mono)}.feed .m{color:var(--ink-3)}
.okc{color:var(--ok);font-weight:600}.badc{color:var(--bad);font-weight:600}
.feed.cols{columns:2;column-gap:24px}
.counts b{color:var(--ink)}

/* IBM Bob: live briefs (BOB_AUTO=1) */
.bobs{margin:0 0 18px;display:grid;gap:10px}
.bobc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px}
.bobc .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bobc .hd .t{color:var(--ink-3);letter-spacing:0}
.bobc .sum{font-size:15px;font-weight:600;margin:6px 0 8px}
.bobc dl,.walk dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;margin:0;font-size:14px}
.bobc dt,.walk dt{color:var(--ink-3)}.bobc dd,.walk dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bobc.working .sum::after{content:" …";animation:l3blink 1s steps(1) infinite}

/* IBM Bob: "Diagnose with Bob" walkthrough */
.walk-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.walk-head .who{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent);color:#fff;font:600 13px var(--mono)}
.walk-head .t{color:var(--ink-3);font:12px var(--mono);margin-left:auto}
.steps{display:flex;gap:4px;list-style:none;padding:0;margin:0 0 18px;border-bottom:1px solid var(--line)}
.steps button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.steps button[aria-current="step"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps .tag{margin-left:6px}
.tag{display:inline-block;font:500 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-2);vertical-align:1px}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.trap{background:var(--trap-bg);color:var(--trap)}.tag.ink{background:var(--accent-bg);color:var(--accent)}
.walk .lead{font-size:17px;line-height:1.55;margin:0 0 18px;max-width:72ch}
.walk dl{padding:16px;background:var(--sunk);border:1px solid var(--line);border-radius:8px}
.walk-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.walk-nav .n{color:var(--ink-3);font:12px var(--mono)}
.thinking{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:24px 0}
.thinking .bar{width:min(420px,100%);height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.thinking .bar::after{content:"";display:block;width:40%;height:100%;background:var(--accent);animation:slide 1.4s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:4px}
.overview button{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.overview button:hover{border-color:var(--ink-3)}
.overview b{display:block;margin:6px 0 2px}.overview span.s{color:var(--ink-3);font-size:13px}

@media (max-width:900px){body{overflow:auto}.app{grid-template-columns:1fr;grid-template-rows:auto;grid-template-areas:"l1" "l2" "l3" "main" "mon"}.main{min-height:60vh}.mon{height:220px}.overview{grid-template-columns:1fr}.bobc dl,.walk dl{grid-template-columns:1fr}.ev{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 28 10v12L16 29 4 22V10z"/><circle cx="16" cy="16" r="4.5"/></svg>
    <div><h1>Chain of Custody · Witness</h1><p class="tagline">Auditor view · all times IST</p></div>
  </div>
  <div class="topr"><span class="restore-msg" id="restoremsg" role="status"></span>
    <button class="btn" id="restore" type="button">Restore to normal</button>
    <button class="btn bob" id="diagnose" type="button" title="Local demo only. This Bob runs as root inside the lab container: it can run commands there and reach Docker. Do not point it at a real server."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>Diagnose with Bob</button>
    <span class="conn" id="conn">CONNECTING</span></div>
</header>
<div class="app">
  <section class="panel main" id="main" aria-live="polite"></section>
  <button class="panel card idle" id="c1" data-layer="1"><span class="lbl">Layer 1</span><span class="nm">Custom commands</span><span class="ds">Guarded commands need the team's profile-id</span><span class="when"></span><span class="bob"></span><span class="st">IDLE</span></button>
  <button class="panel card idle" id="c2" data-layer="2"><span class="lbl">Layer 2</span><span class="nm">Heartbeat &amp; checksum</span><span class="ds">Sealed records, random checks, truth check</span><span class="when"></span><span class="bob"></span><span class="st">IDLE</span></button>
  <button class="panel card idle" id="c3" data-layer="3"><span class="lbl">Layer 3</span><span class="nm">Quarantine</span><span class="ds">Network cut → server locks itself down</span><span class="when"></span><span class="bob"></span><span class="st">IDLE</span></button>
  <section class="panel mon"><div class="hd"><span>Live heartbeat monitor</span>
    <span class="legend"><b style="color:var(--blue)">▲</b> witness asks · <b style="color:var(--green)">▼</b> matches · <b style="color:var(--red)">▼</b> tampered · <b style="color:var(--amber)">?</b> no answer · <b style="color:var(--muted)">•</b> heartbeat</span></div>
    <canvas id="mon" aria-label="Heartbeat and random check monitor"></canvas></section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Every time on the page is Indian Standard Time, whatever the viewer's computer is set to.
const IST = { hour12: false, timeZone: "Asia/Kolkata" };
const clock = (t) => new Date(t * 1000).toLocaleTimeString("en-GB", IST);
// Accepts an ISO string, or epoch seconds (layer events arrive as seconds; transaction events as ISO).
const isoClock = (s) => { const d = new Date(typeof s === "number" ? s * 1000 : s); return isNaN(d) ? esc(s) : d.toLocaleTimeString("en-GB", IST); };
const L2_KINDS = new Set(["sequence_gap", "chain_break", "bad_signature", "unknown_key_id", "entry_edited", "entry_deleted",
  "entries_reordered", "entry_replayed", "late_entry", "challenge_mismatch", "bad_challenge_signature", "record_mismatch",
  "non_monotonic_timestamp", "silence", "missed_challenge", "bad_heartbeat", "replayed_heartbeat", "balance_misreported", "db_edited_without_log"]);
// The fields the witness records for every banking transaction. The amount is kept in minor units.
const NAMES = { txn_id: "txn id", type: "type", amount_minor: "amount", event_id: "event id",
  status: "status", from_account_id: "from account", to_account_id: "to account", timestamp: "time" };
// Copied by the witness from the bank, but only ever shown when one of them changed.
const EXTRA = ["status", "from_account_id", "to_account_id", "timestamp"];
const SHOWN = ["txn_id", "type", "amount_minor", "event_id"];
// The reconciliation names the changed field "amount"; the copies carry it as amount_minor.
const fieldKey = (k) => (k === "amount" ? "amount_minor" : k);
const money = (f, v) => (f === "amount_minor" && Number.isInteger(v) ? (v / 100).toFixed(2) : v ?? "—");

let S = null, alerts = [], events = [], bobs = [], mism = [], acts = [], lastAct = 0, offset = 0;
let view = 0, pinned = false, prevCaught = { 1: 0, 2: 0, 3: 0 };
let layer3WasActive = false, layer3Disconnecting = false;
let monitorTooltips = [];

async function j(p) { const r = await fetch(p, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }

function layerState() {
  const l1 = alerts.filter((a) => a.kind === "layer1_tripwire");
  const l2 = alerts.filter((a) => L2_KINDS.has(a.kind) && !a.resolved);
  const q = S && S.quarantine;
  const on = (n) => S && S.layers[n] !== "off";
  return {
    1: { st: !on(1) ? "idle" : l1.length ? "caught" : "passed", n: l1.length, t: l1.length ? l1[l1.length - 1].time : null },
    2: { st: !on(2) ? "idle" : l2.length ? "caught" : S && S.connection === "waiting" ? "idle" : "passed", n: l2.length, t: l2.length ? l2[l2.length - 1].time : null },
    3: { st: !on(3) ? "idle" : q && q.active ? "caught" : "passed", n: q && q.active ? 1 : 0, t: q && q.since },
  };
}

function renderCards(ls) {
  for (const n of [1, 2, 3]) {
    const c = $("c" + n), s = ls[n];
    const justWentActive = n === 3 && s.st === "caught" && !layer3WasActive;
    if (justWentActive) {
      layer3Disconnecting = true;
      setTimeout(() => { layer3Disconnecting = false; renderAll(); }, 2000);
    }
    if (n === 3) layer3WasActive = s.st === "caught";
    const disconnecting = n === 3 && layer3Disconnecting;
    const shown = view === "bob" ? bobStep === n : view === n;
    c.className = `panel card ${s.st}${shown ? " active" : ""}${disconnecting ? " disconnecting" : ""}`;
    c.querySelector(".st").textContent = disconnecting ? "DISCONNECTING…"
      : s.st === "caught" ? (n === 3 ? "QUARANTINED" : `CAUGHT · ${s.n}`) : s.st === "passed" ? "PASSED" : "IDLE";
    c.querySelector(".when").textContent = disconnecting ? "severing network access"
      : s.st === "caught" && s.t ? "fired " + clock(s.t) : "";
    const b = bobLatest(n);
    c.querySelector(".bob").textContent = !b ? "" : b.trigger === "bob:investigating" ? "IBM Bob: investigating…" : "IBM Bob: " + ((b.detail && b.detail.status) || "reported");
    if (s.n > prevCaught[n] && !pinned && view !== "bob") view = n;  // auto-switch to the layer that just caught something
    prevCaught[n] = s.n;
    if (justWentActive && !pinned && view !== "bob") view = 3;
  }
}

function screen0() {
  const s = S, lv = s.last_verified;
  const reconciliation = s.bank_reconciliation || {};
  const bankNote = reconciliation.rate_limited
    ? `<div class="k">Bank check</div><div class="v">${esc(reconciliation.rate_limit_reason || "Bank rate-limited")}${reconciliation.backoff_until ? " · retry " + clock(Date.parse(reconciliation.backoff_until) / 1000) : ""}</div>`
    : "";
  return `<h2>${esc(s.platform_id || "Waiting for server")}</h2>
  <p class="sub">${s.connection === "connected" ? "Connected · every record sealed, checked and verified" : s.connection === "lost" ? "No contact with the server" : "Waiting for the first heartbeat"}</p>
  <div class="big">
    <div class="stat"><div class="k">Status</div><div class="v ${s.connection === "connected" ? "ok" : "bad"}">${esc(s.connection.toUpperCase())}</div></div>
    <div class="stat"><div class="k">Last verified record</div><div class="v">${lv ? "#" + lv.seq : "—"}</div><div class="k">${lv ? isoClock(lv.time) : ""}</div></div>
    <div class="stat"><div class="k">Records verified</div><div class="v">${s.records_verified}</div></div>
    <div class="stat"><div class="k">Last bank check</div><div class="v">${s.last_sweep ? clock(s.last_sweep) : "—"}</div><div class="k">random, fresh, or suspect records</div></div>
    <div class="stat"><div class="k">Witness bank calls / 15 min</div><div class="v">${reconciliation.bank_calls_last_15m ?? 0} / 60</div></div>
    ${bankNote ? `<div class="stat">${bankNote}</div>` : ""}
  </div>
  <h3 style="margin:26px 0 8px;color:var(--muted);font-size:14px;letter-spacing:.1em;text-transform:uppercase">Latest bank checks</h3>
  <ul class="feed">${acts.filter((a) => a.kind.startsWith("challenge_") && a.kind !== "challenge_issued").slice(-6).reverse()
    .map((a) => `<li><span class="m">${clock(a.time)}</span> <span class="${a.kind === "challenge_ok" ? "okc" : "badc"}">${a.kind === "challenge_ok" ? "✓" : "✗"}</span> ${esc(a.detail.replace(/^c-[0-9a-f]+ /, ""))}</li>`).join("") || '<li class="empty">Waiting for the first check…</li>'}</ul>`;
}

function screen1() {
  const rows = events.filter((e) => e.layer === 1);
  if (!rows.length) return `<h2>Layer 1 · Custom commands</h2><p class="sub">No commands seen yet. The team uses <code>&lt;cmd&gt; --&lt;profile-id&gt;</code>; anything else trips.</p>`;

  const diffEv = [...rows].reverse().find((e) => e.detail && e.detail.diff);
  const snapEv = [...rows].reverse().find((e) => e.detail && e.detail.approved_content !== undefined);

    const d = e.detail || {}, w = e.who || {};

  }).join("");
  const diff = diffEv ? `<pre class="diff">${esc(diffEv.detail.diff).split("\n").map((l) => l.startsWith("+") && !l.startsWith("+++") ? `<span class="add">${l}</span>` : l.startsWith("-") && !l.startsWith("---") ? `<span class="del">${l}</span>` : l).join("\n")}</pre>` : "";
  return `<h2>Layer 1 · Custom commands</h2><p class="sub">Command log from the server</p>
  <table><thead><tr><th>Time</th><th>User</th><th>Source IP</th><th>Command</th><th>Result</th></tr></thead><tbody>${body}</tbody></table>
  ${last ? `<div class="rule">Rule broken: ${esc(last.detail.rule || "Command not in the allowed command set")}.</div>` : ""}
  ${snapEv ? `<p class="sub" style="margin:16px 0 0">${esc(snapEv.detail.file || "log")}: original (approved) vs now</p><div class="ev"><div><b>Original</b><pre class="diff">${esc(snapEv.detail.approved_content || "(empty)")}</pre></div><div><b>Now</b><pre class="diff">${esc(snapEv.detail.current_content || "(file removed)")}</pre></div></div>` : ""}
  ${diffEv ? `<p class="sub" style="margin:16px 0 0">Changes, original → now</p>${diff}` : ""}`;
}

// Highlights the characters of b that differ from a, position by position. When most of the value
// differs, per-character marks are only noise, so the whole cell is left to its red background.
const markDiff = (a, b) => {
  const left = String(a ?? ""), right = String(b ?? "");
  let out = "", changedChars = 0;
  for (let i = 0; i < right.length; i++) {
    if (right[i] !== left[i]) changedChars++;
    out += right[i] === left[i] ? esc(right[i]) : `<mark>${esc(right[i])}</mark>`;
  }
  return changedChars > right.length / 2 ? esc(right) : out;
};
// Where two strings differ, as 1-based character positions: "33–36" or "5, 9–10".
const diffRanges = (a, b) => {
  const left = String(a ?? ""), right = String(b ?? ""), bad = [];
  for (let i = 0; i < Math.max(left.length, right.length); i++) if (left[i] !== right[i]) bad.push(i + 1);
  const parts = [];
  for (let i = 0; i < bad.length;) {
    let j = i;
    while (j + 1 < bad.length && bad[j + 1] === bad[j] + 1) j++;
    parts.push(bad[i] === bad[j] ? `${bad[i]}` : `${bad[i]}–${bad[j]}`);
    i = j + 1;
  }
  return parts.join(", ") || "none";
};
// "+190.01" style difference for the amount, which is kept in minor units.
const deltaText = (k, a, b) => (k === "amount_minor" && Number.isInteger(a) && Number.isInteger(b)
  ? ` <span class="delta">(${b - a >= 0 ? "+" : "−"}${(Math.abs(b - a) / 100).toFixed(2)})</span>` : "");

// Counts only: how many rows the bank has, how many the witness holds copies of, and whether they agree.
const recordsLine = () => {
  const r = S && S.records;
  if (!r || !r.reported) return "";
  return `<p class="sub counts">Bank rows <b>${r.bank_rows}</b> · witness copies <b>${r.witness_copies}</b> · witnessed <b>${r.witnessed_events}</b> · last sync <b>${clock(r.last_sync_time)}</b> · ${r.in_sync ? '<span class="okc">in sync</span>' : `<span class="badc">${r.findings} open finding${r.findings === 1 ? "" : "s"}</span>`}</p>`;
};

const guardBanner = () => {
  const g = alerts.filter((a) => a.kind === "guard_alert" && !a.resolved);
  return g.length ? `<div class="gbanner" role="alert"><b>Guard alert:</b> ${g.length} event${g.length === 1 ? "" : "s"} (instruction-like text withheld from Bob, or Bob tried to call a tool). Latest: ${esc(g[g.length - 1].detail)} <span class="empty">${clock(g[g.length - 1].time)}</span></div>` : "";
};

function screen2() {
  const others = alerts.filter((a) => L2_KINDS.has(a.kind) && a.kind !== "record_mismatch" && !a.resolved);
  const otherList = others.length ? `<div class="more"><h3>Other Layer 2 alerts</h3><ul class="alist">${others.map((a) => `<li><span class="tt">${esc(a.tamper_type || a.kind)}</span> ${esc(a.detail)} <span class="empty">${clock(a.time)}</span></li>`).join("")}</ul></div>` : "";
  if (!mism.length) {
    return `<h2>Layer 2 · Heartbeat &amp; checksum</h2><p class="sub">${others.length ? "Tampering detected" : "Every record checked so far matches the sealed copy"}</p>${recordsLine()}${otherList}`;
  }
  const m = mism[0], w = m.witness_copy || {}, f = m.server_copy || {}, changed = new Set(m.fields.map(fieldKey));
  const ph = m.previous_healthy;
  const shown = [...SHOWN, ...EXTRA.filter((k) => changed.has(k))];
  const cell = (k) => {
    if (m.server_copy === null) return `<div class="bad">missing</div>`;

    return `<div class="${bad ? "bad" : ""}">${shown}${bad ? deltaText(k, w[k], f[k]) + " ←" : ""}</div>`;
  };
  const rows = shown.map((k) => `<div class="f">${NAMES[k] || k}</div><div class="prev">${ph ? esc(money(k, ph.copy[k])) : "—"}</div><div>${esc(money(k, w[k]))}</div>${cell(k)}`).join("");
  const what = m.server_copy === null
    ? [`the bank no longer has record #${m.seq}`]

        ? `<b>${NAMES[k]}</b>: characters ${diffRanges(w[k], f[k])} differ`
        : `<b>${NAMES[k]}</b> ${esc(money(k, w[k]))} → ${esc(money(k, f[k]))}${deltaText(k, w[k], f[k])}`);
  const window = m.issue === "unwitnessed"
    ? `First seen in the bank at <b>${clock(m.first_seen_time || m.caught_time)}</b>. The bank has not sent a witnessed commit for it.`
    : m.last_matched_time
    ? `Matched the bank at <b>${clock(m.last_matched_time)}</b>, first differed at <b>${clock(m.first_seen_time)}</b> (a ${Math.max(0, Math.round(m.first_seen_time - m.last_matched_time))} s window).`
    : `First seen at <b>${clock(m.first_seen_time || m.caught_time)}</b>. No earlier match is on record since the witness started watching.`;
  const rest = mism.slice(1);
  return `<div class="rec-head"><h2>Record #${m.seq}</h2><span class="t">Caught by ${esc(m.caught_by.replace(/ \(c-[0-9a-f]+\)/, ""))} at ${clock(m.caught_time)}</span></div>
  <p class="sub" style="margin:6px 0 0">${window}</p>
  <p class="what"><b>What changed:</b> ${what.join(" &nbsp;·&nbsp; ")}</p>
  ${recordsLine()}
  <div class="cmp four"><div class="h">Field</div><div class="h">${ph ? `Last healthy · #${ph.seq}` : "Last healthy"}</div><div class="h">Witness copy · #${m.seq}</div><div class="h">Bank now · #${m.seq}</div>${rows}</div>
  <p class="sub" style="margin:10px 0 0">${ph ? `Record #${ph.seq} is the nearest earlier record that matched the bank (verified ${clock(ph.verified_time)}).` : "No earlier record matched the bank in this pass, so there is no healthy record to compare with."}</p>
  ${rest.length ? `<div class="more"><h3>Also tampered (found in the sweep)</h3><ul>${rest.map((x) => `<li>#${x.seq} · ${esc(x.fields.length ? x.fields.map((k) => NAMES[fieldKey(k)] || k).join(", ") : "record")}: ${x.server_copy ? x.fields.map((k) => { const key = fieldKey(k); return esc(money(key, x.witness_copy[key])) + " → " + esc(money(key, x.server_copy[key])); }).join(", ") : "missing on server"}</li>`).join("")}</ul></div>` : ""}
  ${otherList}`;
}

function screen3() {
  const q = S.quarantine, last = events.filter((e) => e.layer === 3);
  if (!q || !q.active) {
    const rel = [...last].reverse().find((e) => e.trigger === "quarantine:released");
    return `<h2>Layer 3 · Quarantine</h2><p class="sub">Not active. If the banking server loses contact with the witness for ${(q && q.after) || 45} s, or its witness link settings change, Layer 3 responds. This is a dry run: the response is recorded and nothing is executed.</p>
    ${rel ? `<p class="sub">Last quarantine <b>${esc(rel.detail.quarantine_id)}</b> released at ${isoClock(rel.time)} after key-holder approval.</p>` : ""}`;

  const holders = q.holders.map((h, i) =>
    `<tr><td>${esc(h.name)}</td><td><span class="pill ${h.approved ? "approved" : "pending"}">${h.approved ? "Approved" : "Pending"}</span></td><td><button class="ap" data-holder="${i}" ${h.approved ? "disabled" : ""}>Approve</button></td></tr>`).join("");
  const acts = last.filter((e) => e.detail && e.detail.quarantine_id === q.id && e.trigger === "quarantine:locked");
  const actions = acts.length ? [...(acts[0].detail.site_down || []), ...(acts[0].detail.lockout || [])] : [];
  const dry = acts.length && acts[0].detail.dry_run;
  const demoAccount = acts.length && acts[0].detail.demo_account;
  const status = dry
    ? (q.unlock_issued ? "Unlock signed by the witness. Waiting for the server to apply it…"
      : approved >= q.needed ? "Approvals complete. Unlock will be signed once the server reports in."
      : `${q.needed} of ${q.holders.length} approvals needed to unlock.`)
    : (approved >= q.needed
      ? "Website approval recorded. This page cannot reach ct105 — the demo account is only really restored by running unlock.sh there with 2 of the 3 printed keys."
      : `${q.needed} of ${q.holders.length} website approvals recorded (for demonstration). The real unlock runs on ct105 itself: unlock.sh with 2 of the 3 printed keys.`);
  const headline = !q.confirmed ? "The witness has lost contact with the banking server."
    : dry ? "Layer 3 triggered (dry run). No account was logged out."
    : `Layer 3 triggered: the demo account <b>${esc(demoAccount)}</b> was really logged out and disabled. Nothing else on the server was touched.`;
  return `<p class="quar">${headline}</p>
  <p class="sub">${q.confirmed ? `Server confirmed quarantine <b>${esc(q.id)}</b>${acts.length && acts[0].detail.reason ? ": " + esc(acts[0].detail.reason) : ""}.` : "Reported by the witness: no contact with the server for over " + q.after + " s."} Since ${clock(q.since)}.</p>
  <div class="ev">
    <div class="stat"><div class="k">Verified and stored on witness</div><div class="v ok">#1 – #${lv ? lv.seq : 0}</div><div class="k">${lv ? "up to " + isoClock(lv.time) : ""}</div></div>
    <div class="stat"><div class="k">Unverified since cut</div><div class="v bad">${q.unverified == null ? "unknown" : q.unverified + " records"}</div><div class="k">${q.unverified == null ? "held on the server until the network is back" : "received after reconnect, being verified"}</div></div>
  </div>
  ${actions.length ? `<h3 style="margin-top:20px">${dry ? "What Layer 3 would do" : "What Layer 3 did"}${dry ? ' <span class="empty">(dry run: recorded, nothing executed)</span>' : ' <span class="empty">(✓ really done · • planned only, not executed)</span>'}</h3><ul class="feed cols">${actions.map((r) => `<li><span class="okc">${dry || !r.cmd.startsWith("REAL:") ? "•" : "✓"}</span> ${esc(r.cmd.replace(/^REAL: /, ""))}</li>`).join("")}</ul>` : ""}
  <h3 style="margin-top:20px">Key holders</h3>
  <table class="holders"><tbody>${holders}</tbody></table>
  <p class="need">${status}</p>`;
}

const isBob = (e) => typeof e.trigger === "string" && e.trigger.startsWith("bob:");
// Live briefs (defender with BOB_AUTO=1) are shown for 10 minutes; the walkthrough is the lasting record.
const bobLatest = (n) => [...bobs].reverse().find((e) => e.layer === n && S && S.server_time - e.time < 600);
function bobCard(e) {
  const d = e.detail || {}, working = e.trigger === "bob:investigating";
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  return `<article class="bobc${working ? " working" : ""}"><div class="hd"><span>IBM Bob · Layer ${e.layer} · ${working ? "investigating" : esc(d.status || "report")}</span><span class="t">${clock(e.time)}${d.cost ? " · cost " + esc(d.cost) : ""}</span></div>
    <div class="sum">${esc(d.summary)}</div><dl>${row("What's happening", d.what)}${row("What Bob did", d.did)}${row("Result", d.result)}</dl></article>`;
}
function bobPanel() {
  const list = (typeof view === "number" && view ? [view] : [1, 2, 3]).map(bobLatest).filter(Boolean);
  return list.length ? `<section class="bobs" aria-label="IBM Bob briefs">${list.map(bobCard).join("")}</section>` : "";
}

// "Diagnose with Bob": the witness holds Bob's latest per-layer walkthrough in /status.bob_diagnosis.
// Bob's text is LLM output about attacker activity, so every value goes through esc().
const LAYER_NAMES = { 1: "Custom commands", 2: "Heartbeat & checksum", 3: "Quarantine" };
const statusTag = (st) => {
  const s = String(st || "").toLowerCase();
  const cls = s.startsWith("contained") ? "ok" : s.startsWith("partial") ? "trap" : s.startsWith("fail") ? "bad" : "";
  return `<span class="tag ${cls}">${esc(st || "not reported")}</span>`;
};
let bobStep = 0;
function screenBob() {
  const d = S.bob_diagnosis;
  const again = d && (d.state === "done" || d.state === "failed") ? '<button class="btn" type="button" data-action="again">Diagnose again</button>' : "";
  const head = (t) => `<div class="walk-head"><span class="who" aria-hidden="true">Bob</span><div><h2>IBM Bob · incident walkthrough</h2></div><span class="t">${t}</span>${again}</div>`;
  if (!d) return head("") + `<p class="sub">Run the attacks first, then press <b>Diagnose with Bob</b>. Bob checks the bank server itself and walks you through each layer. <b>Local demo only:</b> this Bob runs as root in the lab container.</p>`;
  if (d.state === "requested" || d.state === "running") {
    const since = Math.max(0, Math.round(Date.now() / 1000 + offset - Date.parse(d.requested_at) / 1000));
    return head(`started ${isoClock(d.requested_at)}`) + `<div class="thinking"><p class="walk lead">${d.state === "requested" ? "Waiting for Bob to pick up the request…" : "Bob is on the bank server, checking Layer 1, 2 and 3: logs, the database and the witness link. It undoes anything still damaged."}</p><div class="bar"></div><span class="empty">${since} s · usually about a minute</span></div>`;
  }
  const meta = `${isoClock(d.updated_at)}${d.seconds ? " · " + d.seconds + " s" : ""}${d.cost ? " · cost " + esc(d.cost) : ""}`;
  if (d.state === "failed") return head(meta) + `<p class="rule">Bob could not finish: ${esc(d.summary)}</p>`;
  const layers = [1, 2, 3].map((n) => d.layers.find((l) => l.layer === n) || { layer: n, status: "not reported" });
  const tabs = [["Overview", ""], ...layers.map((l) => [`Layer ${l.layer}`, statusTag(l.status)])]
    .map(([t, tag], i) => `<li><button type="button" data-step="${i}"${i === bobStep ? ' aria-current="step"' : ""}>${t}${tag}</button></li>`).join("");
  let body;
  if (bobStep === 0) {
    body = `<p class="lead">${esc(d.summary)}</p><div class="overview">${layers.map((l) => `<button type="button" data-step="${l.layer}"><span class="tag">Layer ${l.layer}</span> ${statusTag(l.status)}<b>${esc(LAYER_NAMES[l.layer])}</b><span class="s">${esc((l.what || "").slice(0, 140))}${(l.what || "").length > 140 ? "…" : ""}</span></button>`).join("")}</div>`;
  } else {
    const l = layers[bobStep - 1];
    const row = (k, v) => `<dt>${k}</dt><dd>${v ? esc(v) : '<span class="empty">—</span>'}</dd>`;
    body = `<h3>Layer ${l.layer} · ${esc(LAYER_NAMES[l.layer])} ${statusTag(l.status)}</h3>
      <dl>${row("What happened", l.what)}${row("What Bob did", l.did)}${row("Where it stands", l.result)}</dl>`;
  }
  const nav = `<div class="walk-nav"><button class="btn" type="button" data-step="${bobStep - 1}"${bobStep === 0 ? " disabled" : ""}>Back</button><span class="n">${bobStep === 0 ? "Overview" : `Layer ${bobStep} of 3`}</span>${bobStep < 3 ? `<button class="btn primary" type="button" data-step="${bobStep + 1}">${bobStep === 0 ? "Start with Layer 1" : `Next: Layer ${bobStep + 1}`}</button>` : `<button class="btn" type="button" data-step="0">Back to overview</button>`}</div>`;
  return head(meta) + `<ol class="steps">${tabs}</ol><section class="walk">${body}</section>${nav}`;
}

function renderMain() {
  if (!S) return;
  const html = view === "bob" ? screenBob()
    : guardBanner() + bobPanel() + (view === 1 ? screen1() : view === 2 ? screen2() : view === 3 ? screen3() : screen0());
  if ($("main").dataset.html !== html) { $("main").innerHTML = html; $("main").dataset.html = html; }
}

$("main").addEventListener("click", (e) => {
  const s = e.target.closest("button[data-step]");
  if (!s || s.disabled) return;
  bobStep = Math.max(0, Math.min(3, Number(s.dataset.step)));
  renderAll();
});
$("main").addEventListener("click", async (e) => {
  const b = e.target.closest("button.ap");
  if (!b) return;
  b.disabled = true;
  try { await fetch("/quarantine/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ holder: Number(b.dataset.holder) }) }); } catch (err) { b.disabled = false; }
});
for (const n of [1, 2, 3]) $("c" + n).addEventListener("click", () => {
  if (view === "bob" && S && S.bob_diagnosis && S.bob_diagnosis.state === "done") { bobStep = n; renderAll(); return; }
  view = view === n ? 0 : n; pinned = view !== 0; renderAll();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || e.key === "0") { view = 0; pinned = false; renderAll(); }
  if (view === "bob" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { bobStep = Math.max(0, Math.min(3, bobStep + (e.key === "ArrowRight" ? 1 : -1))); renderAll(); }
});

// Heartbeat monitor: 120 s scrolling window, so several 30 s heartbeats are visible. Up spike = witness asks, down spike = answer.
const WINDOW = 120;
function label(detail) {
  const m = /record #(\d+)/.exec(detail) || /sweep #(\d+)-#(\d+)/.exec(detail);
  if (m && m[2]) return `#${m[1]}–${m[2]}`;
  if (m) return "#" + m[1];
  const st = /state (\S+)/.exec(detail);
  return st ? st[1] : "#latest";
}
function drawMonitor() {
  const cv = $("mon"), dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  monitorTooltips = [];
  if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const now = Date.now() / 1000 + offset, mid = H * 0.55, amp = Math.min(H * 0.38, 70), x = (t) => W - ((now - t) / WINDOW) * W;
  const css = getComputedStyle(document.documentElement), col = (v) => css.getPropertyValue(v).trim();
  g.strokeStyle = col("--line"); g.lineWidth = 1;
  for (let s = 0; s <= WINDOW; s += 15) { const xx = x(now - s); g.beginPath(); g.moveTo(xx, 8); g.lineTo(xx, H - 4); g.stroke(); }
  const recent = acts.filter((a) => a.time > now - WINDOW - 5);
  const beats = recent.filter((a) => a.kind === "heartbeat");
  const lastBeat = S && S.heartbeat_age != null ? S.server_time - S.heartbeat_age : null;
  const dead = !lastBeat || now - lastBeat > 2.5 * ((S && S.heartbeat_interval) || 30);
  // baseline: green while heartbeats arrive, flat red once they stop
  g.lineWidth = 2; g.strokeStyle = dead ? col("--red") : col("--green"); g.setLineDash(dead ? [6, 6] : []);
  g.beginPath(); g.moveTo(0, mid);
  const spikes = recent.filter((a) => a.kind.startsWith("challenge_")).sort((a, b) => a.time - b.time);
  const askX = {};
  for (const a of spikes) {
    const id = a.detail.split(" ")[0];
    if (a.kind === "challenge_issued") { a.x = x(a.time); askX[id] = a.x; }
    else a.x = Math.max(x(a.time), (askX[id] ?? -1e9) + 14);
  }
  for (const a of spikes) {
    const xx = a.x; if (xx < 0) continue;
    const up = a.kind === "challenge_issued";
    g.lineTo(xx - 4, mid); g.lineTo(xx, up ? mid - amp : mid + amp * 0.8); g.lineTo(xx + 4, mid);
  }
  g.lineTo(W, mid); g.stroke(); g.setLineDash([]);
  // colour the spikes and label the asks
  g.font = "600 12px " + col("--mono"); g.textAlign = "center";
  const answered = new Set(spikes.filter((a) => a.kind !== "challenge_issued").map((a) => a.detail.split(" ")[0]));
  let lastLabel = 1e9;
  for (const a of [...spikes].reverse()) {
    const xx = a.x; if (xx < 0) continue;
    const id = a.detail.split(" ")[0];
    if (a.kind === "challenge_issued") {
      g.fillStyle = col("--blue");
      if (lastLabel - xx > 46) { g.fillText(label(a.detail), xx, mid - amp - 6); lastLabel = xx; }
      g.beginPath(); g.arc(xx, mid - amp, 3, 0, 7); g.fill();
      if (!answered.has(id) && now - a.time > 6) {
        const y = mid - amp * 0.4;
        g.fillStyle = col("--amber"); g.fillText("?", xx + 12, y);
        monitorTooltips.push({
          x: xx + 12,
          y,
          text: a.detail.includes("rate limited by the bank") ? "bank rate-limited" : "no answer"
        });
      }
    } else {
      const c = a.kind === "challenge_ok" ? col("--green") : col("--red");
      g.strokeStyle = c; g.lineWidth = 3; g.beginPath(); g.moveTo(xx - 4, mid); g.lineTo(xx, mid + amp * 0.8); g.lineTo(xx + 4, mid); g.stroke();
      if (a.kind !== "challenge_ok") { g.fillStyle = c; g.fillText("✗", xx, mid + amp * 0.8 + 16); }
    }
  }
  g.fillStyle = col("--muted");
  for (const b of beats) { const xx = x(b.time); if (xx >= 0) { g.beginPath(); g.arc(xx, mid, 2.5, 0, 7); g.fill(); } }
  g.textAlign = "left"; g.font = "12px " + col("--mono");
  g.fillText(dead ? "NO HEARTBEAT" : `heartbeat ${S ? (S.heartbeat_age ?? 0).toFixed(0) : 0}s ago`, 6, H - 8);
  g.textAlign = "right"; g.fillText(`−${WINDOW}s … now`, W - 6, H - 8);
}

$("mon").addEventListener("mousemove", (event) => {
  const mark = monitorTooltips.find((item) => Math.abs(item.x - event.offsetX) <= 14 && Math.abs(item.y - event.offsetY) <= 18);
  $("mon").title = mark ? mark.text : "";
});

function renderAll() {
  if (!S) return;
  const conn = S.quarantine && S.quarantine.active ? "quarantined" : S.connection;
  $("conn").className = "conn " + conn;
  $("conn").textContent = conn === "quarantined" && layer3Disconnecting ? "NETWORK OFFLINE" : conn.toUpperCase();
  renderCards(layerState()); renderMain();
}

async function poll() {
  try {
    const [s, a, ev, mm, act] = await Promise.all([j("/status"), j("/alerts"), j("/timeline"), j("/mismatches"), j("/activity?since_id=" + lastAct)]);
    S = s; alerts = a.alerts; bobs = ev.events.filter(isBob); events = ev.events.filter((e) => !isBob(e)); mism = mm.mismatches;
    offset = s.server_time - Date.now() / 1000;
    for (const r of act.activity) {
      acts.push(r); lastAct = Math.max(lastAct, r.id);
      if (r.kind.startsWith("restore_")) lastRestore = r;
    }
    if (lastRestore && !restoreRequesting) {
      const done = lastRestore.kind === "restore_completed";
      $("restoremsg").textContent = `${done ? "Last restore completed" : lastRestore.kind === "restore_failed" ? "Last restore failed" : "Restore requested"} · ${clock(lastRestore.time)} · ${lastRestore.detail}`;
    }
    acts = acts.filter((r) => r.time > s.server_time - 200);
    const ds = s.bob_diagnosis && s.bob_diagnosis.state;
    if (ds === "done" && lastDiagnosisState && lastDiagnosisState !== "done" && view === "bob") bobStep = 0;
    if (ds !== lastDiagnosisState && (ds === "done" || ds === "failed") && $("restoremsg").textContent.startsWith("Bob")) $("restoremsg").textContent = "";
    lastDiagnosisState = ds;
    $("diagnose").textContent = "";
    $("diagnose").insertAdjacentHTML("beforeend", '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>'
      + (ds === "requested" || ds === "running" ? "Bob is diagnosing…" : ds === "done" ? "Bob's walkthrough" : "Diagnose with Bob"));
    renderAll();
  } catch (e) {
    $("conn").className = "conn lost"; $("conn").textContent = "WITNESS UNREACHABLE";
  }
}


let lastRestore = null, restoreRequesting = false;
$("restore").addEventListener("click", async () => {
  const button = $("restore"), msg = $("restoremsg");
  button.disabled = true; restoreRequesting = true; msg.textContent = "Asking ct105 to restore…";
  try {
    const r = await fetch("/v1/restore-request", { method: "POST" });
    const body = await r.json().catch(() => ({}));
    msg.textContent = r.status === 202 ? "Restore requested · ct105 applies it within about 10 seconds"
      : r.status === 429 ? `Wait ${body.retry_after_s} s before another restore`
      : r.status === 409 ? "A restore is already waiting for ct105" : "Restore request failed";
  } catch (e) { msg.textContent = "Restore request failed: witness unreachable"; }
  restoreRequesting = false;
  setTimeout(() => { button.disabled = false; }, 60000);
});

let lastDiagnosisState = null;
async function requestDiagnosis() {
  const button = $("diagnose"), msg = $("restoremsg");
  view = "bob"; pinned = true; bobStep = 0;
  button.disabled = true;
  try {
    const r = await fetch("/v1/diagnose-request", { method: "POST" });
    const body = await r.json().catch(() => ({}));
    msg.textContent = r.status === 202 ? "Bob is on it" : r.status === 429 ? `Wait ${body.retry_after_s} s before asking Bob again`
      : r.status === 409 ? "Bob is already diagnosing" : "Could not reach Bob";
  } catch (e) { msg.textContent = "Could not reach the witness"; }
  setTimeout(() => { button.disabled = false; }, 3000);
  poll();
}
// The top button starts a diagnosis, or just opens Bob's last walkthrough; "Diagnose again" re-runs it.
$("diagnose").addEventListener("click", () => {
  const d = S && S.bob_diagnosis;
  if (d && d.state !== "failed") { view = "bob"; pinned = true; renderAll(); return; }
  requestDiagnosis();
});
$("main").addEventListener("click", (e) => { if (e.target.closest("button[data-action=again]")) requestDiagnosis(); });

poll(); setInterval(poll, 1000);
(function loop() { drawMonitor(); requestAnimationFrame(loop); })();
</script>
</body>
