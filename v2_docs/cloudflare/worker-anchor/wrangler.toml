name = "coc-anchor-worker"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# KV Namespace for storing immutable chain head anchors
# Generate with: npx wrangler kv:namespace create ANCHOR_KV
kv_namespaces = [
  { binding = "ANCHOR_KV", id = "ANCHOR_KV_ID_PLACEHOLDER", preview_id = "ANCHOR_KV_PREVIEW_ID_PLACEHOLDER" }
]

[vars]
# Public key of the witness or shared anchor auth key
WITNESS_PUBLIC_KEY = "witness_genesis_public_key_or_secret"
