# Layer 1 tripwire rules for ct105 (installed to /etc/audit/rules.d/coc-layer1.rules).
# Every rule carries the key coc_l1. The monitor reports a command only when its arguments
# touch the watched bank log path, so ordinary system use of these tools is not reported.
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/nano -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/vi -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/vim -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/sed -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/rm -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/mv -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/cp -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/truncate -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/shred -k coc_l1
-a always,exit -F arch=b64 -S execve -F path=/usr/bin/tee -k coc_l1
